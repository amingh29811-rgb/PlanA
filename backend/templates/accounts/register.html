{% extends "base.html" %}
{% block title %}ثبت‌نام | Plan A{% endblock %}

{% block content %}
<section class="section">
  <div class="container auth-box">
    <h1>ثبت‌نام</h1>

    <form method="post" novalidate>
      {% csrf_token %}
      {% include "accounts/_form_fields.html" %}
      <button type="submit" class="btn btn-block">ساخت حساب</button>
    </form>

    <p class="auth-switch">قبلاً ثبت‌نام کرده‌اید؟ <a href="{% url 'accounts:login' %}">ورود</a></p>
  </div>
</section>
{% endblock %}
